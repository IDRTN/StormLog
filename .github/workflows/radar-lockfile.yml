name: Generate radar analysis dependency lockfile

on:
  push:
    branches:
      - tornado-live-radar-integration-20260911
    paths:
      - .github/workflows/radar-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Generate lockfile
        working-directory: server/radar-analysis
        run: npm install --package-lock-only --ignore-scripts --no-fund
      - name: Verify reproducible install
        working-directory: server/radar-analysis
        run: npm ci --ignore-scripts --no-fund
      - name: Commit generated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/radar-analysis/package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: add verified radar analysis npm lockfile"
            git push
          fi

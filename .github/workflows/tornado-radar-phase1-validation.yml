name: Tornado Radar Phase 1 Validation (No APK)

on:
  push:
    branches:
      - tornado-radar-quantitative-phase1-20260910
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-level2:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24.x'
          cache: npm

      - name: Repair stale npm lockfile if dependency metadata changed
        shell: bash
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if ! git diff --quiet -- package-lock.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add package-lock.json
            git commit -m 'chore: synchronize npm lockfile'
            git push origin HEAD:tornado-radar-quantitative-phase1-20260910
          fi

      - name: Install locked app dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Compile quantitative radar engine integration test
        run: |
          rm -rf /tmp/stormlog-radar-integration
          npx tsc \
            --ignoreConfig \
            src/services/analysis/quantitativeRadarBackend.ts \
            src/services/analysis/tornadoAnalysis.ts \
            src/services/analysis/__tests__/quantitativeRadarIntegration.runtime.test.ts \
            --module commonjs \
            --target ES2022 \
            --moduleResolution node \
            --types node \
            --ignoreDeprecations 6.0 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir /tmp/stormlog-radar-integration

      - name: Validate quantitative radar integration with Tornado Development engine
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE="$(find /tmp/stormlog-radar-integration -type f -name 'quantitativeRadarIntegration.runtime.test.js' -print -quit)"
          if [ -z "$TEST_FILE" ]; then
            echo '::error::Compiled quantitative radar integration test was not emitted'
            find /tmp/stormlog-radar-integration -maxdepth 6 -type f -print
            exit 1
          fi
          echo "Running $TEST_FILE"
          node "$TEST_FILE"

      - name: Install isolated radar backend dependencies
        working-directory: server/radar-analysis
        run: npm install --no-audit --no-fund

      - name: Validate velocity couplet calculations
        working-directory: server/radar-analysis
        run: npm run test:couplet

      - name: Validate multi-scan trend and dual-pol evidence
        working-directory: server/radar-analysis
        run: npm run test:advanced

      - name: Probe live NOAA/NCEP Level II quantitative radar data for KILN
        working-directory: server/radar-analysis
        env:
          RADAR_SITE: KILN
        run: npm run probe

      - name: Confirm no APK was built
        shell: bash
        run: |
          if find . -type f -name '*.apk' -print -quit | grep -q .; then
            echo '::error::Radar validation unexpectedly built an APK'
            exit 1
          fi
          echo 'No APK assembled; radar development remains isolated.'

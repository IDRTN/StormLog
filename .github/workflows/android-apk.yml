name: StormLog Android APK

on:
  workflow_dispatch:

concurrency:
  group: stormlog-android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.16.0"
  JAVA_VERSION: "21"
  EXPO_SDK_VERSION: "57.0.14"
  REACT_NATIVE_VERSION: "0.86.2"
  ANDROID_PACKAGE_NAME: "com.stormlog.app"
  APP_VERSION: "1.0.0"
  EXPECTED_VERSION_CODE: "1"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_NDK_VERSION: "27.1.12297006"
  CMAKE_VERSION: "3.22.1"

jobs:
  build-apk:
    name: Build controlled Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record build identity
        id: identity
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          WORKFLOW_SHA="${{ github.sha }}"
          echo "Git commit SHA: ${COMMIT_SHA}"
          echo "Workflow event SHA: ${WORKFLOW_SHA}"
          test "${COMMIT_SHA}" = "${WORKFLOW_SHA}"

          ACTUAL_EXPO_SDK="$(node -p "require('./node_modules/expo/package.json').version" 2>/dev/null || true)"
          ACTUAL_REACT_NATIVE="$(node -p "require('./react-native/package.json').version" 2>/dev/null || true)"

          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "expo_sdk=${ACTUAL_EXPO_SDK:-not-installed-yet}"
            echo "react_native=${ACTUAL_REACT_NATIVE:-not-installed-yet}"
            echo "node_version=${NODE_VERSION}"
            echo "java_version=${JAVA_VERSION}"
            echo "android_package=${ANDROID_PACKAGE_NAME}"
            echo "app_version=${APP_VERSION}"
            echo "android_api=${ANDROID_API_LEVEL}"
            echo "build_tools=${ANDROID_BUILD_TOOLS_VERSION}"
            echo "ndk_version=${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ env.JAVA_VERSION }}"
          cache: gradle

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deterministic Android components
        run: |
          echo "Android home: ${ANDROID_HOME}"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          sdkmanager --list_installed

      - name: Print instrument build manifest
        run: |
          JAVA_ACTUAL="$(java -version 2>&1 | head -n 1)"
          printf '%s\n' "=== StormLog controlled build manifest ==="
          printf '%s\n' "Commit SHA:                 $(git rev-parse HEAD)"
          printf '%s\n' "Expo SDK requested:         ${EXPO_SDK_VERSION}"
          printf '%s\n' "React Native requested:     ${REACT_NATIVE_VERSION}"
          printf '%s\n' "Android package requested:  ${ANDROID_PACKAGE_NAME}"
          printf '%s\n' "Application version:        ${APP_VERSION} (${EXPECTED_VERSION_CODE})"
          printf '%s\n' "Node requested/actual:      ${NODE_VERSION} / $(node --version)"
          printf '%s\n' "Java requested/actual:      ${JAVA_VERSION} / ${JAVA_ACTUAL}"
          printf '%s\n' "Android API level:          ${ANDROID_API_LEVEL}"
          printf '%s\n' "Android Build Tools:        ${ANDROID_BUILD_TOOLS_VERSION}"
          printf '%s\n' "Android NDK:                ${ANDROID_NDK_VERSION}"
          printf '%s\n' "CMake:                      ${CMAKE_VERSION}"
          printf '%s\n' "==========================================="

      - name: Install exact locked dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: npm ci

      - name: Verify dependency versions
        run: |
          EXPO_INSTALLED="$(node -p "require('./node_modules/expo/package.json').version")"
          REACT_NATIVE_INSTALLED="$(node -p "require('./react-native/package.json').version")"
          echo "Installed Expo SDK: ${EXPO_INSTALLED}"
          echo "Installed React Native: ${REACT_NATIVE_INSTALLED}"

          test "${EXPO_INSTALLED}" = "${EXPO_SDK_VERSION}"
          test "${REACT_NATIVE_INSTALLED}" = "${REACT_NATIVE_VERSION}"

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Snapshot application source hashes
        run: |
          git ls-files -z -- app src assets app.json package.json package-lock.json tsconfig.json eas.json \
            | xargs -0 sha256sum > /tmp/stormlog-source-before.sha256
          sha256sum /tmp/stormlog-source-before.sha256

      - name: Generate Android native project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Validate generated Android configuration
        run: |
          GRADLE_FILE="android/build.gradle"
          test -f "${GRADLE_FILE}"

          echo "--- Generated Android version settings ---"
          grep -nE '(buildToolsVersion|compileSdkVersion|targetSdkVersion|minSdkVersion|ndkVersion)' "${GRADLE_FILE}" || true

          DETECTED_BUILD_TOOLS="$(sed -n 's/^[[:space:]]*buildToolsVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "${GRADLE_FILE}" | tail -n 1)"
          DETECTED_API="$(sed -n 's/^[[:space:]]*compileSdkVersion[[:space:]]*=[[:space:]]*["]*\([0-9][0-9]*\)["]*.*/\1/p' "${GRADLE_FILE}" | tail -n 1)"

          if [ -n "${DETECTED_BUILD_TOOLS}" ]; then
            test "${DETECTED_BUILD_TOOLS}" = "${ANDROID_BUILD_TOOLS_VERSION}"
            echo "Generated Build Tools verified: ${DETECTED_BUILD_TOOLS}"
          fi

          if [ -n "${DETECTED_API}" ]; then
            test "${DETECTED_API}" = "${ANDROID_API_LEVEL}"
            echo "Generated API level verified: ${DETECTED_API}"
          fi

          test -f "android/app/build.gradle"
          grep -Fq 'namespace "com.stormlog.app"' android/app/build.gradle

      - name: Build unsigned-testable debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify application source was unchanged
        run: |
          git diff --exit-code -- app src assets app.json package.json package-lock.json tsconfig.json eas.json
          git ls-files -z -- app src assets app.json package.json package-lock.json tsconfig.json eas.json \
            | xargs -0 sha256sum > /tmp/stormlog-source-after.sha256
          cmp /tmp/stormlog-source-before.sha256 /tmp/stormlog-source-after.sha256
          echo "PASS: application source and configuration hashes are unchanged"

      - name: Validate installable APK
        run: |
          APK_SOURCE="android/app/build/outputs/apk/debug/app-debug.apk"
          AAPT2="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt2"
          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner"

          test -f "${APK_SOURCE}" && test -s "${APK_SOURCE}"
          unzip -tq "${APK_SOURCE}"

          BADGING="$("${AAPT2}" dump badging "${APK_SOURCE}")"
          echo "${BADGING}"

          echo "${BADGING}" | grep -F "package: name='${ANDROID_PACKAGE_NAME}' versionCode='${EXPECTED_VERSION_CODE}' versionName='${APP_VERSION}'"
          echo "${BADGING}" | grep -Eq "native-code:[[:space:]]+.*arm64-v8a"

          "${APKSIGNER}" verify --verbose "${APK_SOURCE}"

          cp "${APK_SOURCE}" stormlog-current.apk
          APK_SHA256="$(sha256sum stormlog-current.apk | awk '{print $1}')"
          APK_SIZE="$(stat -c %s stormlog-current.apk)"

          {
            echo "APK size bytes: ${APK_SIZE}"
            echo "APK SHA-256: ${APK_SHA256}"
            echo "Package: ${ANDROID_PACKAGE_NAME}"
            echo "Version: ${APP_VERSION} (${EXPECTED_VERSION_CODE})"
            echo "Built from commit: $(git rev-parse HEAD)"
            echo "TypeScript validation: PASS"
            echo "Application source hash verification: PASS"
          } | tee build-validation.txt

          {
            echo "## StormLog Controlled APK Build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | $(git rev-parse HEAD) |"
            echo "| Package | ${ANDROID_PACKAGE_NAME} |"
            echo "| Version | ${APP_VERSION} (${EXPECTED_VERSION_CODE}) |"
            echo "| Expo SDK | ${EXPO_SDK_VERSION} |"
            echo "| React Native | ${REACT_NATIVE_VERSION} |"
            echo "| Node | $(node --version) |"
            echo "| Android Build Tools | ${ANDROID_BUILD_TOOLS_VERSION} |"
            echo "| APK size | ${APK_SIZE} bytes |"
            echo "| APK SHA-256 | \`${APK_SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traceable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormLog-APK-${{ github.run_number }}-${{ github.sha }}
          path: stormlog-current.apk
          if-no-files-found: error
          retention-days: 30

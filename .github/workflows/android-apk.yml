name: StormLog Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - master
      - phase1-reliability-fix

concurrency:
  group: stormlog-android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "22.16.0"
  JAVA_VERSION: "21"
  EXPO_SDK_VERSION: "57.0.14"
  REACT_NATIVE_VERSION: "0.86.2"
  ANDROID_PACKAGE_NAME: "com.stormlog.app"
  APP_VERSION: "1.0.0"
  EXPECTED_VERSION_CODE: "1"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_NDK_VERSION: "27.1.12297006"
  CMAKE_VERSION: "3.22.1"

jobs:
  build-apk:
    name: Build controlled Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current baseline
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record build identity
        id: identity
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          WORKFLOW_SHA="${{ github.sha }}"
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          echo "Git commit SHA: ${COMMIT_SHA}"
          echo "Workflow event SHA: ${WORKFLOW_SHA}"
          test "${COMMIT_SHA}" = "${WORKFLOW_SHA}"

          case "${BUILD_TYPE}" in
            debug|release) ;;
            *) echo "::error::Unsupported build type: ${BUILD_TYPE}"; exit 1 ;;
          esac

          ACTUAL_EXPO_SDK="$(node -p "require('./node_modules/expo/package.json').version" 2>/dev/null || true)"
          ACTUAL_REACT_NATIVE="$(node -p "require('./react-native/package.json').version" 2>/dev/null || true)"

          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "build_type=${BUILD_TYPE}"
            echo "expo_sdk=${ACTUAL_EXPO_SDK:-not-installed-yet}"
            echo "react_native=${ACTUAL_REACT_NATIVE:-not-installed-yet}"
            echo "node_version=${NODE_VERSION}"
            echo "java_version=${JAVA_VERSION}"
            echo "android_package=${ANDROID_PACKAGE_NAME}"
            echo "app_version=${APP_VERSION}"
            echo "android_api=${ANDROID_API_LEVEL}"
            echo "build_tools=${ANDROID_BUILD_TOOLS_VERSION}"
            echo "ndk_version=${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm

      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ env.JAVA_VERSION }}"

      - name: Configure Android SDK
        id: setup-android-sdk
        uses: android-actions/setup-android@v3

      - name: Install deterministic Android components
        id: install-android-components
        run: |
          echo "Android home: ${ANDROID_HOME}"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          sdkmanager --list_installed

      - name: Remove disposable runner content
        id: cleanup-runner
        run: |
          set -euo pipefail

          echo "=== Disk audit before cleanup ==="
          df -h /
          for directory in \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "${ANDROID_HOME}/emulator" \
            "${ANDROID_HOME}/system-images"
          do
            if [ -e "${directory}" ]; then
              du -sh "${directory}"
            else
              echo "not present: ${directory}"
            fi
          done

          remove_path() {
            local path="$1"
            if [ -e "${path}" ]; then
              echo "Removing disposable path: ${path} ($(du -sh "${path}" | cut -f1))"
              sudo rm -rf --one-file-system "${path}"
            fi
          }

          remove_children_except() {
            local parent="$1"
            local preserved_name="$2"

            if [ ! -d "${parent}" ]; then
              return
            fi

            local removable_bytes
            removable_bytes="$(find "${parent}" -mindepth 1 -maxdepth 1 -type d ! -name "${preserved_name}" -print0 \
              | xargs -0 -r du -sb --total \
              | awk '$NF == "total" {print $1}')"

            if [ -n "${removable_bytes}" ] && [ "${removable_bytes}" -gt 0 ]; then
              printf 'Removing %s entries other than %s (%d bytes)\n' \
                "${parent}" "${preserved_name}" "${removable_bytes}"
              find "${parent}" -mindepth 1 -maxdepth 1 -type d ! -name "${preserved_name}" -exec rm -rf -- {} +
            fi
          }

          remove_path /usr/share/dotnet
          remove_path /usr/share/swift
          remove_path /opt/ghc
          remove_path /usr/local/.ghcup
          remove_path /opt/hostedtoolcache/CodeQL
          remove_path /usr/local/share/boost
          remove_path "${ANDROID_HOME}/emulator"
          remove_path "${ANDROID_HOME}/system-images"

          remove_children_except "${ANDROID_HOME}/platforms" "android-${ANDROID_API_LEVEL}"
          remove_children_except "${ANDROID_HOME}/build-tools" "${ANDROID_BUILD_TOOLS_VERSION}"
          remove_children_except "${ANDROID_HOME}/ndk" "${ANDROID_NDK_VERSION}"
          remove_children_except "${ANDROID_HOME}/cmake" "${CMAKE_VERSION}"

          docker system prune -af --volumes >/dev/null
          sudo apt-get clean

          test -d "${ANDROID_HOME}/cmdline-tools"
          test -d "${ANDROID_HOME}/platform-tools"
          test -d "${ANDROID_HOME}/licenses"
          test -d "${ANDROID_HOME}/platforms/android-${ANDROID_API_LEVEL}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ANDROID_HOME}/cmake/${CMAKE_VERSION}"

          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Print instrument build manifest
        id: build-manifest
        run: |
          JAVA_ACTUAL="$(java -version 2>&1 | head -n 1)"
          printf '%s\n' "=== StormLog controlled build manifest ==="
          printf '%s\n' "Commit SHA:                 $(git rev-parse HEAD)"
          printf '%s\n' "Expo SDK requested:         ${EXPO_SDK_VERSION}"
          printf '%s\n' "React Native requested:     ${REACT_NATIVE_VERSION}"
          printf '%s\n' "Android package requested:  ${ANDROID_PACKAGE_NAME}"
          printf '%s\n' "Application version:        ${APP_VERSION} (${EXPECTED_VERSION_CODE})"
          printf '%s\n' "Node requested/actual:      ${NODE_VERSION} / $(node --version)"
          printf '%s\n' "Java requested/actual:      ${JAVA_VERSION} / ${JAVA_ACTUAL}"
          printf '%s\n' "Android API level:          ${ANDROID_API_LEVEL}"
          printf '%s\n' "Android Build Tools:        ${ANDROID_BUILD_TOOLS_VERSION}"
          printf '%s\n' "Android NDK:                ${ANDROID_NDK_VERSION}"
          printf '%s\n' "CMake:                      ${CMAKE_VERSION}"
          if [[ "${{ steps.identity.outputs.build_type }}" == "release" ]]; then
            printf '%s\n' "Build type:                 release"
          else
            printf '%s\n' "Build type:                 debug"
          fi
          printf '%s\n' "==========================================="

      - name: Install exact locked dependencies
        id: install-dependencies
        run: npm ci

      - name: Verify TypeScript
        id: typecheck
        run: npx tsc --noEmit

      - name: Run tests
        id: tests
        run: npm test -- --runInBand

      - name: Build Android APK
        id: build
        run: |
          BUILD_TYPE="${{ steps.identity.outputs.build_type }}"
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            npx expo prebuild --platform android --no-install
            cd android
            ./gradlew assembleRelease
            cd ..
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          else
            npx expo prebuild --platform android --no-install
            cd android
            ./gradlew assembleDebug
            cd ..
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -f "${APK_PATH}"
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify APK identity
        id: verify-apk
        run: |
          APK_PATH="${{ steps.build.outputs.apk_path }}"
          test -f "${APK_PATH}"
          echo "APK: ${APK_PATH}"
          ls -lh "${APK_PATH}"
          sha256sum "${APK_PATH}"

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: StormLog-APK-${{ github.run_number }}-${{ github.sha }}
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

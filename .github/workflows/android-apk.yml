name: StormLog Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug

concurrency:
  group: stormlog-android-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22.16.0"
  JAVA_VERSION: "21"
  EXPO_SDK_VERSION: "57.0.14"
  REACT_NATIVE_VERSION: "0.86.2"
  ANDROID_PACKAGE_NAME: "com.stormlog.app"
  APP_VERSION: "1.0.0"
  EXPECTED_VERSION_CODE: "1"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_NDK_VERSION: "27.1.12297006"
  CMAKE_VERSION: "3.22.1"

jobs:
  build-apk:
    name: Build controlled Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record build identity
        id: identity
        run: |
          COMMIT_SHA="$(git rev-parse HEAD)"
          WORKFLOW_SHA="${{ github.sha }}"
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          echo "Git commit SHA: ${COMMIT_SHA}"
          echo "Workflow event SHA: ${WORKFLOW_SHA}"
          test "${COMMIT_SHA}" = "${WORKFLOW_SHA}"

          case "${BUILD_TYPE}" in
            debug|release) ;;
            *) echo "::error::Unsupported build type: ${BUILD_TYPE}"; exit 1 ;;
          esac

          ACTUAL_EXPO_SDK="$(node -p "require('./node_modules/expo/package.json').version" 2>/dev/null || true)"
          ACTUAL_REACT_NATIVE="$(node -p "require('./react-native/package.json').version" 2>/dev/null || true)"

          {
            echo "commit_sha=${COMMIT_SHA}"
            echo "build_type=${BUILD_TYPE}"
            echo "expo_sdk=${ACTUAL_EXPO_SDK:-not-installed-yet}"
            echo "react_native=${ACTUAL_REACT_NATIVE:-not-installed-yet}"
            echo "node_version=${NODE_VERSION}"
            echo "java_version=${JAVA_VERSION}"
            echo "android_package=${ANDROID_PACKAGE_NAME}"
            echo "app_version=${APP_VERSION}"
            echo "android_api=${ANDROID_API_LEVEL}"
            echo "build_tools=${ANDROID_BUILD_TOOLS_VERSION}"
            echo "ndk_version=${ANDROID_NDK_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ env.JAVA_VERSION }}"

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install deterministic Android components
        run: |
          echo "Android home: ${ANDROID_HOME}"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"
          sdkmanager --list_installed

      - name: Remove disposable runner content
        run: |
          set -euo pipefail

          echo "=== Disk audit before cleanup ==="
          df -h /
          for directory in \
            /usr/share/dotnet \
            /usr/share/swift \
            /opt/ghc \
            /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            "${ANDROID_HOME}/emulator" \
            "${ANDROID_HOME}/system-images"
          do
            if [ -e "${directory}" ]; then
              du -sh "${directory}"
            else
              echo "not present: ${directory}"
            fi
          done

          remove_path() {
            local path="$1"
            if [ -e "${path}" ]; then
              echo "Removing disposable path: ${path} ($(du -sh "${path}" | cut -f1))"
              sudo rm -rf --one-file-system "${path}"
            fi
          }

          remove_children_except() {
            local parent="$1"
            local preserved_name="$2"

            if [ ! -d "${parent}" ]; then
              return
            fi

            local removable_bytes
            removable_bytes="$(find "${parent}" -mindepth 1 -maxdepth 1 -type d ! -name "${preserved_name}" -print0 \
              | xargs -0 -r du -sb --total \
              | awk '$NF == "total" {print $1}')"

            if [ -n "${removable_bytes}" ] && [ "${removable_bytes}" -gt 0 ]; then
              printf 'Removing %s entries other than %s (%d bytes)\n' \
                "${parent}" "${preserved_name}" "${removable_bytes}"
              find "${parent}" -mindepth 1 -maxdepth 1 -type d ! -name "${preserved_name}" -exec rm -rf -- {} +
            fi
          }

          remove_path /usr/share/dotnet
          remove_path /usr/share/swift
          remove_path /opt/ghc
          remove_path /usr/local/.ghcup
          remove_path /opt/hostedtoolcache/CodeQL
          remove_path /usr/local/share/boost
          remove_path "${ANDROID_HOME}/emulator"
          remove_path "${ANDROID_HOME}/system-images"

          remove_children_except "${ANDROID_HOME}/platforms" "android-${ANDROID_API_LEVEL}"
          remove_children_except "${ANDROID_HOME}/build-tools" "${ANDROID_BUILD_TOOLS_VERSION}"
          remove_children_except "${ANDROID_HOME}/ndk" "${ANDROID_NDK_VERSION}"
          remove_children_except "${ANDROID_HOME}/cmake" "${CMAKE_VERSION}"

          docker system prune -af --volumes >/dev/null
          sudo apt-get clean

          test -d "${ANDROID_HOME}/cmdline-tools"
          test -d "${ANDROID_HOME}/platform-tools"
          test -d "${ANDROID_HOME}/licenses"
          test -d "${ANDROID_HOME}/platforms/android-${ANDROID_API_LEVEL}"
          test -d "${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}"
          test -d "${ANDROID_HOME}/ndk/${ANDROID_NDK_VERSION}"
          test -d "${ANDROID_HOME}/cmake/${CMAKE_VERSION}"

          echo "=== Disk space after cleanup ==="
          df -h /

      - name: Print instrument build manifest
        run: |
          JAVA_ACTUAL="$(java -version 2>&1 | head -n 1)"
          printf '%s\n' "=== StormLog controlled build manifest ==="
          printf '%s\n' "Commit SHA:                 $(git rev-parse HEAD)"
          printf '%s\n' "Expo SDK requested:         ${EXPO_SDK_VERSION}"
          printf '%s\n' "React Native requested:     ${REACT_NATIVE_VERSION}"
          printf '%s\n' "Android package requested:  ${ANDROID_PACKAGE_NAME}"
          printf '%s\n' "Application version:        ${APP_VERSION} (${EXPECTED_VERSION_CODE})"
          printf '%s\n' "Node requested/actual:      ${NODE_VERSION} / $(node --version)"
          printf '%s\n' "Java requested/actual:      ${JAVA_VERSION} / ${JAVA_ACTUAL}"
          printf '%s\n' "Android API level:          ${ANDROID_API_LEVEL}"
          printf '%s\n' "Android Build Tools:        ${ANDROID_BUILD_TOOLS_VERSION}"
          printf '%s\n' "Android NDK:                ${ANDROID_NDK_VERSION}"
          printf '%s\n' "CMake:                      ${CMAKE_VERSION}"
          if [[ "${{ steps.identity.outputs.build_type }}" == "release" ]]; then
            printf '%s\n' "Build type:                 release"
          else
            printf '%s\n' "Build type:                 debug"
          fi
          printf '%s\n' "==========================================="

      - name: Install exact locked dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: npm ci

      - name: Verify dependency versions
        run: |
          EXPO_INSTALLED="$(node -p "require('./node_modules/expo/package.json').version")"
          REACT_NATIVE_INSTALLED="$(node -p "require('./node_modules/react-native/package.json').version")"
          echo "Installed Expo SDK: ${EXPO_INSTALLED}"
          echo "Installed React Native: ${REACT_NATIVE_INSTALLED}"

          test "${EXPO_INSTALLED}" = "${EXPO_SDK_VERSION}"
          test "${REACT_NATIVE_INSTALLED}" = "${REACT_NATIVE_VERSION}"

      - name: Run TypeScript validation
        run: npm run typecheck

      - name: Snapshot application source hashes
        run: |
          git ls-files -z -- app src assets app.json package.json package-lock.json tsconfig.json eas.json \
            | xargs -0 sha256sum > /tmp/stormlog-source-before.sha256
          sha256sum /tmp/stormlog-source-before.sha256

      - name: Generate Android native project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Validate generated Android configuration
        run: |
          GRADLE_FILE="android/build.gradle"
          test -f "${GRADLE_FILE}"

          echo "--- Generated Android version settings ---"
          grep -nE '(buildToolsVersion|compileSdkVersion|targetSdkVersion|minSdkVersion|ndkVersion)' "${GRADLE_FILE}" || true

          DETECTED_BUILD_TOOLS="$(sed -n 's/^[[:space:]]*buildToolsVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' "${GRADLE_FILE}" | tail -n 1)"
          DETECTED_API="$(sed -n 's/^[[:space:]]*compileSdkVersion[[:space:]]*=[[:space:]]*["]*\([0-9][0-9]*\)["]*.*/\1/p' "${GRADLE_FILE}" | tail -n 1)"

          if [ -n "${DETECTED_BUILD_TOOLS}" ]; then
            test "${DETECTED_BUILD_TOOLS}" = "${ANDROID_BUILD_TOOLS_VERSION}"
            echo "Generated Build Tools verified: ${DETECTED_BUILD_TOOLS}"
          fi

          if [ -n "${DETECTED_API}" ]; then
            test "${DETECTED_API}" = "${ANDROID_API_LEVEL}"
            echo "Generated API level verified: ${DETECTED_API}"
          fi

          test -f "android/app/build.gradle"
          grep -Fq "namespace 'com.stormlog.app'" android/app/build.gradle

      - name: Configure release signing from GitHub secrets
        if: steps.identity.outputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORMLOG_RELEASE_KEYSTORE: ${{ runner.temp }}/stormlog-release.keystore
          STORMLOG_RELEASE_SIGNING_GRADLE: ${{ runner.temp }}/stormlog-release-signing.gradle
        run: |
          set -euo pipefail

          missing=0
          for variable in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD
          do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error title=Release signing configuration incomplete::Required GitHub secret ${variable} is not set."
              missing=1
            fi
          done
          if (( missing > 0 )); then
            exit "${missing}"
          fi

          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode \
            > "${STORMLOG_RELEASE_KEYSTORE}"
          chmod 600 "${STORMLOG_RELEASE_KEYSTORE}"
          test -s "${STORMLOG_RELEASE_KEYSTORE}"

          if ! KEYSTORE_ENTRY="$(keytool \
            -list \
            -alias "${ANDROID_KEY_ALIAS}" \
            -keystore "${STORMLOG_RELEASE_KEYSTORE}" \
            -storepass "${ANDROID_KEYSTORE_PASSWORD}" \
            2>/dev/null)"; then
            echo "::error title=Release signing configuration invalid::The keystore could not be opened or the configured alias was not found."
            exit 1
          fi

          if ! printf '%s\n' "${KEYSTORE_ENTRY}" | grep -Fq 'PrivateKeyEntry'; then
            echo "::error title=Release signing configuration invalid::The configured alias does not contain a private key."
            exit 1
          fi

          cat > "${STORMLOG_RELEASE_SIGNING_GRADLE}" <<'GRADLE'
          android {
            signingConfigs {
              stormlogRelease {
                storeFile file(System.getenv("STORMLOG_RELEASE_KEYSTORE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }

            buildTypes {
              release {
                signingConfig signingConfigs.stormlogRelease
              }
            }
          }
          GRADLE

          chmod 600 "${STORMLOG_RELEASE_SIGNING_GRADLE}"
          printf '\napply from: "%s"\n' "${STORMLOG_RELEASE_SIGNING_GRADLE}" \
            >> android/app/build.gradle
          echo "Release signing configuration installed from GitHub secrets."

      - name: Build unsigned-testable debug APK
        if: steps.identity.outputs.build_type == 'debug'
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Build signed standalone release APK
        if: steps.identity.outputs.build_type == 'release'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORMLOG_RELEASE_KEYSTORE: ${{ runner.temp }}/stormlog-release.keystore
          STORMLOG_RELEASE_SIGNING_GRADLE: ${{ runner.temp }}/stormlog-release-signing.gradle
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify source with expected CNG changes
        run: |
          git diff --exit-code -- app src assets app.json package-lock.json tsconfig.json eas.json

          git ls-files -z -- app src assets app.json package.json package-lock.json tsconfig.json eas.json \
            | xargs -0 sha256sum > /tmp/stormlog-source-after.sha256

          EXPECTED_PACKAGE_JSON="$(mktemp)"
          git show HEAD:package.json \
            | sed -e 's/"android": "expo start --android"/"android": "expo run:android"/' \
                   -e 's/"ios": "expo start --ios"/"ios": "expo run:ios"/' \
            > "${EXPECTED_PACKAGE_JSON}"
          cmp "${EXPECTED_PACKAGE_JSON}" package.json
          rm "${EXPECTED_PACKAGE_JSON}"

          grep -vE '^[0-9a-f]{64}  package\.json$' /tmp/stormlog-source-before.sha256 \
            > /tmp/stormlog-source-before-without-cng-package.sha256
          grep -vE '^[0-9a-f]{64}  package\.json$' /tmp/stormlog-source-after.sha256 \
            > /tmp/stormlog-source-after-without-cng-package.sha256
          cmp /tmp/stormlog-source-before-without-cng-package.sha256 /tmp/stormlog-source-after-without-cng-package.sha256

          echo "PASS: application source and configuration hashes are unchanged"
          echo "PASS: package.json contains only the two deterministic Expo CNG script changes"

      - name: Validate installable APK
        run: |
          BUILD_TYPE="${{ steps.identity.outputs.build_type }}"
          APK_SOURCE="android/app/build/outputs/${BUILD_TYPE}/app-${BUILD_TYPE}.apk"
          AAPT2="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/aapt2"
          APKSIGNER="${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION}/apksigner"

          test -f "${APK_SOURCE}" && test -s "${APK_SOURCE}"
          unzip -tq "${APK_SOURCE}"

          BADGING="$("${AAPT2}" dump badging "${APK_SOURCE}")"
          echo "${BADGING}"

          echo "${BADGING}" | grep -F "package: name='${ANDROID_PACKAGE_NAME}' versionCode='${EXPECTED_VERSION_CODE}' versionName='${APP_VERSION}'"
          echo "${BADGING}" | grep -Eq "native-code:[[:space:]]+.*arm64-v8a"

          if [[ "${BUILD_TYPE}" == "release" ]]; then
            if ! zipinfo -1 "${APK_SOURCE}" | grep -Fxq 'assets/index.android.bundle'; then
              echo "::error::Release APK is not standalone: assets/index.android.bundle is missing."
              exit 1
            fi

            MANIFEST="$("${AAPT2}" dump xmltree --file AndroidManifest.xml "${APK_SOURCE}")"
            if printf '%s\n' "${MANIFEST}" | grep -Eq 'android:debuggable\(0x0101000f\)=true'; then
              echo "::error::Release APK must not be debuggable."
              exit 1
            fi

            CERTIFICATES="$("${APKSIGNER}" verify --print-certs "${APK_SOURCE}")"
            if printf '%s\n' "${CERTIFICATES}" | grep -Fq 'CN=Android Debug'; then
              echo "::error::Release APK is signed by the Android Debug certificate."
              exit 1
            fi
          fi

          "${APKSIGNER}" verify --verbose "${APK_SOURCE}"

          cp "${APK_SOURCE}" stormlog-current.apk
          APK_SHA256="$(sha256sum stormlog-current.apk | awk '{print $1}')"
          APK_SIZE="$(stat -c %s stormlog-current.apk)"

          {
            echo "APK size bytes: ${APK_SIZE}"
            echo "APK SHA-256: ${APK_SHA256}"
            echo "Package: ${ANDROID_PACKAGE_NAME}"
            echo "Version: ${APP_VERSION} (${EXPECTED_VERSION_CODE})"
            echo "Built from commit: $(git rev-parse HEAD)"
            echo "TypeScript validation: PASS"
            echo "Application source hash verification: PASS"
          } | tee build-validation.txt

          {
            echo "## StormLog Controlled APK Build"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Commit | $(git rev-parse HEAD) |"
            echo "| Build type | ${BUILD_TYPE} |"
            echo "| Standalone JS bundle | $([[ "${BUILD_TYPE}" == release ]] && echo verified || echo not-applicable) |"
            echo "| Package | ${ANDROID_PACKAGE_NAME} |"
            echo "| Version | ${APP_VERSION} (${EXPECTED_VERSION_CODE}) |"
            echo "| Expo SDK | ${EXPO_SDK_VERSION} |"
            echo "| React Native | ${REACT_NATIVE_VERSION} |"
            echo "| Node | $(node --version) |"
            echo "| Android Build Tools | ${ANDROID_BUILD_TOOLS_VERSION} |"
            echo "| APK size | ${APK_SIZE} bytes |"
            echo "| APK SHA-256 | \`${APK_SHA256}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload traceable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormLog-APK-${{ github.run_number }}-${{ github.sha }}
          path: stormlog-current.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing material
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/stormlog-release.keystore" \
                "${RUNNER_TEMP}/stormlog-release-signing.gradle"

name: StormLog Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Android build type
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
  push:
    branches:
      - master
      - phase1-reliability-fix

concurrency:
  group: stormlog-android-apk-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  NODE_VERSION: "22.16.0"
  JAVA_VERSION: "21"
  EXPO_SDK_VERSION: "57.0.14"
  REACT_NATIVE_VERSION: "0.86.2"
  ANDROID_PACKAGE_NAME: "com.stormlog.app"
  APP_VERSION: "1.0.0"
  EXPECTED_VERSION_CODE: "1"
  ANDROID_API_LEVEL: "36"
  ANDROID_BUILD_TOOLS_VERSION: "36.0.0"
  ANDROID_NDK_VERSION: "27.1.12297006"
  CMAKE_VERSION: "3.22.1"

jobs:
  build-apk:
    name: Build controlled Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out current baseline
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Record build identity
        id: identity
        run: |
          set -euo pipefail
          COMMIT_SHA="$(git rev-parse HEAD)"
          WORKFLOW_SHA="${{ github.sha }}"
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          echo "Git commit SHA: ${COMMIT_SHA}"
          echo "Workflow event SHA: ${WORKFLOW_SHA}"
          test "${COMMIT_SHA}" = "${WORKFLOW_SHA}"
          case "${BUILD_TYPE}" in
            debug|release) ;;
            *) echo "::error::Unsupported build type: ${BUILD_TYPE}"; exit 1 ;;
          esac
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_type=${BUILD_TYPE}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm

      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "${{ env.JAVA_VERSION }}"

      - name: Configure Android SDK
        id: setup-android-sdk
        uses: android-actions/setup-android@v3

      - name: Install deterministic Android components
        id: install-android-components
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null
          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Install exact locked dependencies
        id: install-dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: npm ci

      - name: Verify dependency versions
        id: verify-dependencies
        run: |
          set -euo pipefail
          EXPO_INSTALLED="$(node -p "require('./node_modules/expo/package.json').version")"
          REACT_NATIVE_INSTALLED="$(node -p "require('./node_modules/react-native/package.json').version")"
          echo "Installed Expo SDK: ${EXPO_INSTALLED}"
          echo "Installed React Native: ${REACT_NATIVE_INSTALLED}"
          test "${EXPO_INSTALLED}" = "${EXPO_SDK_VERSION}"
          test "${REACT_NATIVE_INSTALLED}" = "${REACT_NATIVE_VERSION}"

      - name: Verify TypeScript
        id: typecheck
        run: npx tsc --noEmit

      - name: Install pinned test runner
        id: install-test-runner
        run: npm install --no-save --no-package-lock tsx@4.23.12

      - name: Run deterministic TypeScript test suite
        id: tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' TEST_FILES < <(find src -type f -path '*/__tests__/*.test.ts' -print0 | sort -z)
          if [ "${#TEST_FILES[@]}" -eq 0 ]; then
            echo "::error::No TypeScript test files were found under src/**/__tests__/*.test.ts"
            exit 1
          fi
          echo "Discovered ${#TEST_FILES[@]} TypeScript test files."
          for test_file in "${TEST_FILES[@]}"; do
            echo "=== Running ${test_file} ==="
            npx --no-install tsx "${test_file}"
          done

      - name: Generate Android native project
        id: expo-prebuild
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
          NPM_CONFIG_LEGACY_PEER_DEPS: "true"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Validate generated Android configuration
        id: validate-native-config
        run: |
          set -euo pipefail
          test -f android/app/build.gradle
          grep -Fq "namespace 'com.stormlog.app'" android/app/build.gradle
          test -d android

      - name: Enable embedded JS bundle for standalone debug APK
        id: enable-debug-bundle
        if: steps.identity.outputs.build_type == 'debug'
        run: |
          set -euo pipefail
          GRADLE_FILE="android/app/build.gradle"
          test -f "${GRADLE_FILE}"
          REACT_BLOCK_COUNT="$(grep -Eic '^[[:space:]]*react[[:space:]]*\{[[:space:]]*$' "${GRADLE_FILE}")"
          test "${REACT_BLOCK_COUNT}" -eq 1
          TEMP_GRADLE="$(mktemp)"
          awk '
            BEGIN { inserted = 0 }
            !inserted && $0 ~ /^[[:space:]]*react[[:space:]]*\{[[:space:]]*$/ {
              print
              print "    debuggableVariants = []"
              inserted = 1
              next
            }
            { print }
            END { if (!inserted) exit 1 }
          ' "${GRADLE_FILE}" > "${TEMP_GRADLE}"
          mv "${TEMP_GRADLE}" "${GRADLE_FILE}"
          test "$(grep -cF 'debuggableVariants = []' "${GRADLE_FILE}")" -eq 1
          echo "Configured standalone debug APK to embed the JavaScript bundle."

      - name: Configure release signing from GitHub secrets
        id: configure-release-signing
        if: steps.identity.outputs.build_type == 'release'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORMLOG_RELEASE_KEYSTORE: ${{ runner.temp }}/stormlog-release.keystore
          STORMLOG_RELEASE_SIGNING_GRADLE: ${{ runner.temp }}/stormlog-release-signing.gradle
        run: |
          set -euo pipefail
          missing=0
          for variable in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!variable:-}" ]]; then
              echo "::error::Required release signing secret ${variable} is not set."
              missing=1
            fi
          done
          if (( missing > 0 )); then exit "${missing}"; fi
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | tr -d '\r\n' | base64 --decode > "${STORMLOG_RELEASE_KEYSTORE}"
          chmod 600 "${STORMLOG_RELEASE_KEYSTORE}"
          keytool -list -alias "${ANDROID_KEY_ALIAS}" -keystore "${STORMLOG_RELEASE_KEYSTORE}" -storepass "${ANDROID_KEYSTORE_PASSWORD}" >/dev/null
          cat > "${STORMLOG_RELEASE_SIGNING_GRADLE}" <<'GRADLE'
          android {
            signingConfigs {
              stormlogRelease {
                storeFile file(System.getenv("STORMLOG_RELEASE_KEYSTORE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }
            buildTypes {
              release {
                signingConfig signingConfigs.stormlogRelease
              }
            }
          }
          GRADLE
          chmod 600 "${STORMLOG_RELEASE_SIGNING_GRADLE}"
          printf '\napply from: "%s"\n' "${STORMLOG_RELEASE_SIGNING_GRADLE}" >> android/app/build.gradle

      - name: Build Android APK
        id: build
        run: |
          set -euo pipefail
          BUILD_TYPE="${{ steps.identity.outputs.build_type }}"
          if [[ "${BUILD_TYPE}" == "release" ]]; then
            cd android
            ./gradlew assembleRelease --no-daemon
            cd ..
            APK_PATH="android/app/build/outputs/apk/release/app-release.apk"
          else
            cd android
            ./gradlew assembleDebug --no-daemon
            cd ..
            APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          test -s "${APK_PATH}"
          echo "apk_path=${APK_PATH}" >> "$GITHUB_OUTPUT"

      - name: Verify APK identity and embedded JS bundle
        id: verify-apk
        run: |
          set -euo pipefail
          APK_PATH="${{ steps.build.outputs.apk_path }}"
          test -s "${APK_PATH}"
          echo "APK: ${APK_PATH}"
          ls -lh "${APK_PATH}"
          sha256sum "${APK_PATH}"
          if [[ "${{ steps.identity.outputs.build_type }}" == "debug" ]]; then
            echo "Checking standalone debug APK for embedded React Native bundle..."
            unzip -l "${APK_PATH}" | grep -E 'assets/(index\.android\.bundle|index\.android\.bundle\.map)$'
            echo "Embedded JavaScript bundle verified."
          fi

      - name: Upload APK
        id: upload-apk
        uses: actions/upload-artifact@v4
        with:
          name: StormLog-APK-${{ github.run_number }}-${{ github.sha }}
          path: ${{ steps.build.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

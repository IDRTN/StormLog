name: Daily Monitor Audit Validation

on:
  push:
    branches:
      - daily-monitor-hardening-pipeline-audit-20260906

concurrency:
  group: daily-monitor-audit-validation
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  EXPO_PUBLIC_STORMLOG_LIGHTNING_URL: "https://stormlog-lightning-proxy.idontrememberthename74.workers.dev"
  EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN: ${{ secrets.STORMLOG_LIGHTNING_TOKEN }}

jobs:
  validate:
    name: Validate full pipeline without APK assembly
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Require lightning client token
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN:-}" ]]; then
            echo "::error title=Missing lightning token::Repository Actions secret STORMLOG_LIGHTNING_TOKEN is required."
            exit 1
          fi

      - name: Verify live lightning proxy authentication
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H 'accept: application/json' \
            -H "x-stormlog-client-token: ${EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN}" \
            "${EXPO_PUBLIC_STORMLOG_LIGHTNING_URL}/events?latitude=40&longitude=-82.5&radiusKm=1&sinceMs=0&untilMs=0")"
          test "$STATUS" = "200"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(p.events))throw new Error("Worker 200 response is missing events array")' "$RESPONSE_FILE"

      - uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          cache: npm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android build components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run Daily Monitor hardening runtime tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-hardening-tests
          npx tsc --ignoreConfig \
            src/util/dateUtils.ts \
            src/services/background/dailyMonitorCoordinator.ts \
            src/services/background/__tests__/dailyMonitorHardening.runtime.test.ts \
            --rootDir src --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-hardening-tests
          CLAIM_STUB="/tmp/stormlog-hardening-tests/services/background/dailyMonitorClaim.js"
          test -f "$CLAIM_STUB"
          cat > "$CLAIM_STUB" <<'JS'
          exports.claimAutomaticCollection = async () => true;
          exports.markDailyMonitorCollectionSucceeded = async () => undefined;
          exports.releaseAutomaticCollectionLease = async () => undefined;
          JS
          TEST_FILE="/tmp/stormlog-hardening-tests/services/background/__tests__/dailyMonitorHardening.runtime.test.js"
          node "$TEST_FILE" 2>&1 | tee /tmp/stormlog-hardening-tests.log
          ! grep -q 'Cannot find module' /tmp/stormlog-hardening-tests.log

      - name: Run Daily Monitor location fallback tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-location-tests
          npx tsc --ignoreConfig \
            src/services/background/dailyMonitorLocationResolver.ts \
            src/services/background/__tests__/dailyMonitorLocationResolver.runtime.test.ts \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-location-tests
          TEST_FILE="$(find /tmp/stormlog-location-tests -name dailyMonitorLocationResolver.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Run automatic storm policy tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-auto-storm-tests
          npx tsc --ignoreConfig \
            src/services/stormLogs/automaticStormPolicy.ts \
            src/services/stormLogs/__tests__/automaticStormPolicy.runtime.test.ts \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-auto-storm-tests
          TEST_FILE="$(find /tmp/stormlog-auto-storm-tests -name automaticStormPolicy.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Run warning lifecycle integration tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-warning-lifecycle-tests
          npx tsc --ignoreConfig \
            src/database/__tests__/warningLifecycle.test.ts \
            --rootDir src --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-warning-lifecycle-tests
          node /tmp/stormlog-warning-lifecycle-tests/database/__tests__/warningLifecycle.test.js

      - name: Verify automatic storm wiring
        shell: bash
        run: |
          set -euo pipefail
          require_source() {
            local file="$1"; local needle="$2"; local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "::error title=Automatic storm lifecycle wiring missing::${label} (${file})"
              exit 1
            fi
          }
          require_source src/services/stormLogs/automaticStormPolicy.ts "'Severe Thunderstorm Watch'" "Severe Thunderstorm Watch policy"
          require_source src/services/stormLogs/processNwsWarning.ts 'AUTOMATIC_NWS_TRIGGER_EVENTS' "NWS processor shared policy"
          require_source src/services/stormLogs/nwsWarningTrigger.ts 'recordAutomaticNwsTriggerSnapshot' "NWS freshness snapshot"
          require_source src/services/lightning/lightningService.ts 'isLightningAutoStartCandidate' "lightning auto-start"
          require_source src/services/lightning/lightningService.ts 'evaluateAutomaticStormStop' "lightning lifecycle evaluation"
          require_source app/_layout.tsx 'getLastNotificationResponseAsync' "cold-start stop-action recovery"
          require_source src/services/notifications.ts 'categoryIdentifier: AUTOMATIC_STORM_STOP_CATEGORY' "stop-review category"
          node <<'NODE'
          const fs=require('fs');const ts=require('typescript');
          const p='src/database/warningEvents.ts';const t=fs.readFileSync(p,'utf8');
          const sf=ts.createSourceFile(p,t,ts.ScriptTarget.Latest,true,ts.ScriptKind.TS);
          const fn=sf.statements.find(s=>ts.isFunctionDeclaration(s)&&s.name?.text==='expireDueAutomaticWarnings');
          if(!fn?.body) throw new Error('expireDueAutomaticWarnings not found');
          const body=fn.body.getText(sf);
          if(/SET\s+endTime/i.test(body)) throw new Error('NWS expiry closes storm event directly');
          if(!/SET\s+warning_status\s*=\s*\?/i.test(body)) throw new Error('NWS expiry does not update warning status');
          if(!/WARNING_EVENT_STATUS_EXPIRED/.test(body)) throw new Error('NWS expiry does not use EXPIRED state');
          NODE

      - name: Verify scheduler source architecture
        shell: bash
        run: |
          set -euo pipefail
          SCHED="modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogAlarmScheduler.kt"
          RECEIVER="modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogSchedulerAlarmReceiver.kt"
          WORKER="modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogHeadlessTaskService.kt"
          grep -Fq 'setExactAndAllowWhileIdle' "$SCHED"
          grep -Fq 'canScheduleExactAlarms' "$SCHED"
          ! grep -Fq 'setAndAllowWhileIdle' "$SCHED"
          grep -Fq 'ContextCompat.startForegroundService' "$RECEIVER"
          grep -Fq 'HeadlessJsTaskService.acquireWakeLockNow' "$RECEIVER"
          grep -Fq 'startForeground' "$WORKER"
          grep -Fq 'stopForeground' "$WORKER"
          grep -Fq 'StormLogDailyMonitorHeadless' "$WORKER"
          grep -Fq 'StormLogDailyMonitorHeadless' src/services/background/dailyMonitorHeadless.ts
          grep -Fq "import './src/services/background/dailyMonitorHeadless'" index.js
          grep -Fq 'requestBackgroundPermissionsAsync' src/hooks/useDailyMonitor.ts
          grep -Fq "'android:foregroundServiceType': 'location|dataSync'" plugins/withStormLogScheduler.js
          test ! -f modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogSchedulerService.kt

      - name: Generate Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify generated native wiring
        shell: bash
        run: |
          set -euo pipefail
          npx expo-modules-autolinking resolve --platform android > /tmp/stormlog-autolinking.json
          grep -qi 'storm-log-scheduler' /tmp/stormlog-autolinking.json
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -Fq 'StormLogHeadlessTaskService' "$MANIFEST"
          grep -Fq 'android:foregroundServiceType="location|dataSync"' "$MANIFEST"
          grep -Fq 'FOREGROUND_SERVICE_DATA_SYNC' "$MANIFEST"
          grep -Fq 'FOREGROUND_SERVICE_LOCATION' "$MANIFEST"
          grep -Fq 'ACCESS_BACKGROUND_LOCATION' "$MANIFEST"
          grep -Fq 'SCHEDULE_EXACT_ALARM' "$MANIFEST"
          grep -Fq 'StormLogSchedulerAlarmReceiver' "$MANIFEST"
          grep -Fq 'StormLogExactAlarmPermissionReceiver' "$MANIFEST"
          grep -Fq 'StormLogSchedulerBootReceiver' "$MANIFEST"
          ! grep -Fq 'StormLogSchedulerService' "$MANIFEST"

      - name: Verify Gradle autolinking and native compilation
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew projects --no-daemon | tee /tmp/stormlog-gradle-projects.txt
          grep -qi 'storm-log-scheduler' /tmp/stormlog-gradle-projects.txt
          ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Confirm no APK was assembled
        shell: bash
        run: |
          set -euo pipefail
          if find android/app/build/outputs/apk -type f -name '*.apk' -print -quit 2>/dev/null | grep -q .; then
            echo "::error title=Audit contract violated::Validation-only workflow unexpectedly assembled an APK"
            exit 1
          fi
          echo "Validation complete; APK assembly intentionally not run."

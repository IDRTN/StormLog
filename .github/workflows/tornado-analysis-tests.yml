name: StormLog Tornado Analysis Tests

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-analysis:
    name: Validate advanced tornado analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - name: Install locked dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Compile NWS alert display test
        run: |
          rm -rf /tmp/stormlog-alert-display-tests
          npx tsc \
            --ignoreConfig \
            src/services/nws/alertDisplay.ts \
            src/services/nws/__tests__/alertDisplay.runtime.test.ts \
            --module commonjs \
            --target ES2022 \
            --moduleResolution node \
            --types node \
            --ignoreDeprecations 6.0 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir /tmp/stormlog-alert-display-tests

      - name: Run NWS alert display test
        run: node /tmp/stormlog-alert-display-tests/__tests__/alertDisplay.runtime.test.js

      - name: Compile weather provider runtime test
        run: |
          rm -rf /tmp/stormlog-weather-tests
          npx tsc \
            --ignoreConfig \
            src/services/weather/__tests__/weatherProvider.runtime.test.ts \
            --module commonjs \
            --target ES2022 \
            --moduleResolution node \
            --types node \
            --ignoreDeprecations 6.0 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir /tmp/stormlog-weather-tests

      - name: Run weather provider runtime test
        run: |
          TEST_FILE="$(find /tmp/stormlog-weather-tests -name weatherProvider.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Compile temperature comfort test
        run: |
          rm -rf /tmp/stormlog-temperature-tests
          npx tsc \
            --ignoreConfig \
            src/services/analysis/heatIndex.ts \
            src/services/analysis/temperatureComfort.ts \
            src/services/analysis/__tests__/temperatureComfort.runtime.test.ts \
            --module commonjs \
            --target ES2022 \
            --moduleResolution node \
            --types node \
            --ignoreDeprecations 6.0 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir /tmp/stormlog-temperature-tests

      - name: Run temperature comfort test
        run: node /tmp/stormlog-temperature-tests/__tests__/temperatureComfort.runtime.test.js

      - name: Compile advanced environment test
        run: |
          rm -rf /tmp/stormlog-analysis-tests
          npx tsc \
            --ignoreConfig \
            src/services/analysis/advancedEnvironment.ts \
            src/services/analysis/__tests__/advancedEnvironment.runtime.test.ts \
            --module commonjs \
            --target ES2022 \
            --moduleResolution node \
            --ignoreDeprecations 6.0 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir /tmp/stormlog-analysis-tests

      - name: Run advanced environment test
        run: node /tmp/stormlog-analysis-tests/__tests__/advancedEnvironment.runtime.test.js

      - name: Compile HRRR environment test
        run: |
          rm -rf /tmp/stormlog-hrrr-tests
          npx tsc \
            --ignoreConfig \
            src/services/analysis/hrrrEnvironment.ts \
            src/services/analysis/__tests__/hrrrEnvironment.runtime.test.ts \
            --module commonjs \
            --target ES2022 \
            --moduleResolution node \
            --types node \
            --ignoreDeprecations 6.0 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir /tmp/stormlog-hrrr-tests

      - name: Run HRRR environment test
        run: |
          TEST_FILE="$(find /tmp/stormlog-hrrr-tests -name hrrrEnvironment.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Compile tornado analysis runtime test
        run: |
          rm -rf /tmp/stormlog-tornado-tests
          npx tsc \
            --ignoreConfig \
            src/services/analysis/tornadoAnalysis.ts \
            src/services/analysis/__tests__/tornadoAnalysis.runtime.test.ts \
            --module commonjs \
            --target ES2022 \
            --moduleResolution node \
            --ignoreDeprecations 6.0 \
            --esModuleInterop \
            --skipLibCheck \
            --outDir /tmp/stormlog-tornado-tests

      - name: Run tornado analysis runtime test
        run: node /tmp/stormlog-tornado-tests/__tests__/tornadoAnalysis.runtime.test.js

name: Daily Monitor Hardening APK

on:
  push:
    branches:
      - daily-monitor-hardening
  workflow_dispatch:

concurrency:
  group: daily-monitor-hardening-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  EXPO_PUBLIC_STORMLOG_LIGHTNING_URL: "https://stormlog-lightning-proxy.idontrememberthename74.workers.dev"
  EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN: ${{ secrets.STORMLOG_LIGHTNING_TOKEN }}

jobs:
  validate-and-build:
    name: Validate hardening and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v6

      - name: Require lightning client token
        shell: bash
        run: |
          if [[ -z "${EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN:-}" ]]; then
            echo "::error title=Missing lightning token::Repository Actions secret STORMLOG_LIGHTNING_TOKEN is required."
            exit 1
          fi

      - name: Verify live lightning proxy authentication
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H 'accept: application/json' \
            -H "x-stormlog-client-token: ${EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN}" \
            "${EXPO_PUBLIC_STORMLOG_LIGHTNING_URL}/events?latitude=40&longitude=-82.5&radiusKm=1&sinceMs=0&untilMs=0")"
          echo "Lightning proxy HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            BODY="$(head -c 500 "$RESPONSE_FILE" | tr '\n' ' ')"
            echo "::error title=Lightning proxy live check failed::Worker returned HTTP $STATUS: $BODY"
            exit 1
          fi
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(p.events))throw new Error("Worker 200 response is missing events array")' "$RESPONSE_FILE"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Compile Daily Monitor hardening runtime tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-hardening-tests
          npx tsc --ignoreConfig \
            src/util/dateUtils.ts \
            src/services/background/dailyMonitorCoordinator.ts \
            src/services/background/__tests__/dailyMonitorHardening.runtime.test.ts \
            --rootDir src \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-hardening-tests

          CLAIM_STUB="/tmp/stormlog-hardening-tests/services/background/dailyMonitorClaim.js"
          test -f "$CLAIM_STUB"
          cat > "$CLAIM_STUB" <<'JS'
          exports.claimAutomaticCollection = async () => true;
          exports.markDailyMonitorCollectionSucceeded = async () => undefined;
          exports.releaseAutomaticCollectionLease = async () => undefined;
          JS

      - name: Run Daily Monitor hardening runtime tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE="/tmp/stormlog-hardening-tests/services/background/__tests__/dailyMonitorHardening.runtime.test.js"
          test -s "$TEST_FILE"
          node "$TEST_FILE" 2>&1 | tee /tmp/stormlog-hardening-tests.log
          if grep -q 'Cannot find module' /tmp/stormlog-hardening-tests.log; then
            echo "::error title=Daily Monitor test harness leak::Runtime test crossed an unstubbed native-module boundary"
            exit 1
          fi

      - name: Compile Daily Monitor location fallback tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-location-tests
          npx tsc --ignoreConfig \
            src/services/background/dailyMonitorLocationResolver.ts \
            src/services/background/__tests__/dailyMonitorLocationResolver.runtime.test.ts \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-location-tests

      - name: Run Daily Monitor location fallback tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE="$(find /tmp/stormlog-location-tests -name dailyMonitorLocationResolver.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Compile automatic storm lifecycle policy tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-auto-storm-tests
          npx tsc --ignoreConfig \
            src/services/stormLogs/automaticStormPolicy.ts \
            src/services/stormLogs/__tests__/automaticStormPolicy.runtime.test.ts \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-auto-storm-tests

      - name: Run automatic storm lifecycle policy tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE="$(find /tmp/stormlog-auto-storm-tests -name automaticStormPolicy.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Compile warning lifecycle integration tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-warning-lifecycle-tests
          npx tsc --ignoreConfig \
            src/database/__tests__/warningLifecycle.test.ts \
            --rootDir src \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-warning-lifecycle-tests

      - name: Run warning lifecycle integration tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE="/tmp/stormlog-warning-lifecycle-tests/database/__tests__/warningLifecycle.test.js"
          test -s "$TEST_FILE"
          node "$TEST_FILE"

      - name: Verify automatic storm lifecycle wiring
        shell: bash
        run: |
          set -euo pipefail

          require_source() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "::error title=Automatic storm lifecycle wiring missing::${label} (${file})"
              exit 1
            fi
          }

          require_source src/services/stormLogs/automaticStormPolicy.ts "'Severe Thunderstorm Watch'" "Severe Thunderstorm Watch trigger policy"
          require_source src/services/stormLogs/processNwsWarning.ts 'AUTOMATIC_NWS_TRIGGER_EVENTS' "NWS warning processor consumes shared automatic-trigger policy"
          require_source src/services/stormLogs/nwsWarningTrigger.ts 'recordAutomaticNwsTriggerSnapshot' "successful NWS fetch records lifecycle freshness snapshot"
          require_source src/services/stormLogs/automaticStormPolicy.ts 'LIGHTNING_AUTO_START_RADIUS_MILES = 20' "20-mile lightning auto-start radius"
          require_source src/services/stormLogs/automaticStormPolicy.ts 'LIGHTNING_AUTO_STOP_RADIUS_MILES = 30' "30-mile lightning clear radius"
          require_source src/services/stormLogs/automaticStormPolicy.ts 'AUTO_STOP_REVIEW_GRACE_MS = 30' "30-minute unanswered stop-review grace"
          require_source src/services/lightning/lightningService.ts "LIGHTNING_TRIGGER_SOURCE = 'LIGHTNING_PROXIMITY'" "lightning automatic trigger source"
          require_source src/services/lightning/lightningService.ts 'isLightningAutoStartCandidate' "lightning proximity auto-start evaluation"
          require_source src/services/lightning/lightningService.ts 'evaluateAutomaticStormStop' "fresh lightning drives automatic stop lifecycle"
          require_source app/_layout.tsx 'KEEP_RECORDING_ACTION' "Keep Recording action handler"
          require_source app/_layout.tsx 'STOP_RECORDING_ACTION' "Stop Recording action handler"
          require_source app/_layout.tsx 'getLastNotificationResponseAsync' "cold-start notification action recovery"
          require_source src/services/notifications.ts 'categoryIdentifier: AUTOMATIC_STORM_STOP_CATEGORY' "stop-review notification category"

          node <<'NODE'
          const fs = require('fs');
          const ts = require('typescript');
          const filePath = 'src/database/warningEvents.ts';
          const sourceText = fs.readFileSync(filePath, 'utf8');
          const sourceFile = ts.createSourceFile(filePath, sourceText, ts.ScriptTarget.Latest, true, ts.ScriptKind.TS);
          const expiryFunction = sourceFile.statements.find(
            (statement) => ts.isFunctionDeclaration(statement) && statement.name?.text === 'expireDueAutomaticWarnings'
          );
          if (!expiryFunction || !expiryFunction.body) {
            console.error('::error title=Automatic storm lifecycle wiring missing::expireDueAutomaticWarnings function was not found');
            process.exit(1);
          }
          const expiryBody = expiryFunction.body.getText(sourceFile);
          if (/SET\s+endTime/i.test(expiryBody)) {
            console.error('::error title=Automatic storm lifecycle regression::NWS expiry closes the event directly');
            process.exit(1);
          }
          if (!/SET\s+warning_status\s*=\s*\?/i.test(expiryBody)) {
            console.error('::error title=Automatic storm lifecycle wiring missing::Expiry routine does not update warning_status');
            process.exit(1);
          }
          if (!/WARNING_EVENT_STATUS_EXPIRED/.test(expiryBody)) {
            console.error('::error title=Automatic storm lifecycle wiring missing::Expiry routine does not use WARNING_EVENT_STATUS_EXPIRED');
            process.exit(1);
          }
          NODE

      - name: Verify scheduler source architecture
        shell: bash
        run: |
          set -euo pipefail
          SCHED="modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogAlarmScheduler.kt"
          RECEIVER="modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogSchedulerAlarmReceiver.kt"
          WORKER="modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogHeadlessTaskService.kt"
          HEADLESS_JS="src/services/background/dailyMonitorHeadless.ts"
          INDEX="index.js"

          require_file() {
            if [[ ! -f "$1" ]]; then
              echo "::error title=Scheduler architecture missing::Required file $1 does not exist"
              exit 1
            fi
          }
          require_text() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if ! grep -Fq "$needle" "$file"; then
              echo "::error title=Scheduler architecture missing::${label} (${file})"
              exit 1
            fi
          }
          forbid_text() {
            local file="$1"
            local needle="$2"
            local label="$3"
            if grep -Fq "$needle" "$file"; then
              echo "::error title=Scheduler architecture regression::${label} (${file})"
              exit 1
            fi
          }

          require_file "$SCHED"
          require_file "$RECEIVER"
          require_file "$WORKER"
          require_file "$HEADLESS_JS"
          require_file "$INDEX"
          if [[ -f modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogSchedulerService.kt ]]; then
            echo "::error title=Scheduler architecture regression::Obsolete always-running scheduler service still exists"
            exit 1
          fi

          require_text "$SCHED" 'setExactAndAllowWhileIdle' "exact AlarmManager scheduling"
          require_text "$SCHED" 'canScheduleExactAlarms' "exact-alarm permission verification"
          forbid_text "$SCHED" 'setAndAllowWhileIdle' "inexact AlarmManager fallback is forbidden"
          require_text "$SCHED" 'Exact alarm access required' "user-visible exact-alarm status"
          require_text "$RECEIVER" 'ContextCompat.startForegroundService' "alarm launches foreground headless worker"
          require_text "$RECEIVER" 'HeadlessJsTaskService.acquireWakeLockNow' "alarm acquires Headless JS wake lock"
          require_text "$WORKER" 'startForeground' "headless worker promotes itself immediately"
          require_text "$WORKER" 'stopForeground' "headless worker removes foreground state after collection"
          require_text "$WORKER" 'StormLogDailyMonitorHeadless' "native worker task name"
          require_text "$HEADLESS_JS" 'StormLogDailyMonitorHeadless' "JS headless task name"
          require_text "$HEADLESS_JS" "performDailyCollection('automatic')" "headless task enters automatic coordinator path"
          require_text "$INDEX" "import './src/services/background/dailyMonitorHeadless'" "headless task registration loads before router entry"
          require_text app.json 'ACCESS_BACKGROUND_LOCATION' "background location permission"
          require_text app.json 'isAndroidBackgroundLocationEnabled' "Expo background location configuration"
          require_text plugins/withStormLogScheduler.js "'android:foregroundServiceType': 'location|dataSync'" "worker foreground-service types"
          require_text src/hooks/useDailyMonitor.ts 'requestBackgroundPermissionsAsync' "UI requests background location permission"

          if grep -R -Fq 'StormLogSchedulerService.start' modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler; then
            echo "::error title=Scheduler architecture regression::Obsolete scheduler service start reference remains"
            exit 1
          fi

      - name: Generate Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify native scheduler autolinking and manifest wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f modules/storm-log-scheduler/android/build.gradle
          npx expo-modules-autolinking resolve --platform android > /tmp/stormlog-autolinking.json
          if ! grep -qi 'storm-log-scheduler' /tmp/stormlog-autolinking.json; then
            echo "::error title=Native scheduler autolinking missing::storm-log-scheduler was not resolved"
            exit 1
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          require_manifest() {
            local needle="$1"
            local label="$2"
            if ! grep -Fq "$needle" "$MANIFEST"; then
              echo "::error title=Generated manifest wiring missing::${label}"
              exit 1
            fi
          }

          require_manifest 'StormLogHeadlessTaskService' 'headless worker service'
          require_manifest 'android:foregroundServiceType="location|dataSync"' 'location+dataSync foreground-service types'
          require_manifest 'FOREGROUND_SERVICE_DATA_SYNC' 'data-sync foreground-service permission'
          require_manifest 'FOREGROUND_SERVICE_LOCATION' 'location foreground-service permission'
          require_manifest 'ACCESS_BACKGROUND_LOCATION' 'background location permission'
          require_manifest 'SCHEDULE_EXACT_ALARM' 'exact-alarm permission'
          require_manifest 'StormLogSchedulerAlarmReceiver' 'alarm receiver'
          require_manifest 'StormLogExactAlarmPermissionReceiver' 'exact-alarm permission receiver'
          require_manifest 'StormLogSchedulerBootReceiver' 'boot/update recovery receiver'
          require_manifest 'BOOT_COMPLETED' 'boot recovery action'
          require_manifest 'MY_PACKAGE_REPLACED' 'APK update recovery action'

          if grep -Fq 'StormLogSchedulerService' "$MANIFEST"; then
            echo "::error title=Generated manifest regression::Obsolete always-running scheduler service is still registered"
            exit 1
          fi

      - name: Verify Gradle includes native scheduler project
        shell: bash
        run: |
          set -euo pipefail
          (cd android && ./gradlew projects --no-daemon) | tee /tmp/stormlog-gradle-projects.txt
          if ! grep -qi 'storm-log-scheduler' /tmp/stormlog-gradle-projects.txt; then
            echo "::error title=Gradle autolinking missing::storm-log-scheduler project is absent"
            exit 1
          fi

      - name: Enable embedded JS bundle for standalone debug APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="android/app/build.gradle"
          test -f "$GRADLE_FILE"
          test "$(grep -Eic '^[[:space:]]*react[[:space:]]*\{[[:space:]]*$' "$GRADLE_FILE")" -eq 1
          TEMP_GRADLE="$(mktemp)"
          awk '
            BEGIN { inserted = 0 }
            !inserted && $0 ~ /^[[:space:]]*react[[:space:]]*\{[[:space:]]*$/ {
              print
              print "    debuggableVariants = []"
              inserted = 1
              next
            }
            { print }
            END { if (!inserted) exit 1 }
          ' "$GRADLE_FILE" > "$TEMP_GRADLE"
          mv "$TEMP_GRADLE" "$GRADLE_FILE"
          test "$(grep -cF 'debuggableVariants = []' "$GRADLE_FILE")" -eq 1

      - name: Build hardening debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify APK and scheduler packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

          if command -v apkanalyzer >/dev/null 2>&1; then
            MANIFEST=/tmp/stormlog-apk-manifest.xml
            apkanalyzer manifest print "$APK" > "$MANIFEST"

            echo "--- Packaged StormLog scheduler manifest entries ---"
            grep -nE 'StormLog|foregroundServiceType|FOREGROUND_SERVICE_(DATA_SYNC|LOCATION)|ACCESS_BACKGROUND_LOCATION|SCHEDULE_EXACT_ALARM' "$MANIFEST" || true
            echo "--------------------------------------------------"

            require_manifest_entry() {
              local pattern="$1"
              local label="$2"
              if ! grep -qE "$pattern" "$MANIFEST"; then
                echo "::error title=APK packaging verification failed::Missing ${label} in packaged AndroidManifest.xml"
                return 1
              fi
            }

            require_manifest_entry 'StormLogHeadlessTaskService' 'headless foreground worker service'
            require_manifest_entry 'StormLogSchedulerAlarmReceiver' 'alarm receiver'
            require_manifest_entry 'StormLogSchedulerBootReceiver' 'boot/update recovery receiver'
            require_manifest_entry 'StormLogExactAlarmPermissionReceiver' 'exact-alarm permission receiver'
            require_manifest_entry 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' 'FOREGROUND_SERVICE_DATA_SYNC permission'
            require_manifest_entry 'android.permission.FOREGROUND_SERVICE_LOCATION' 'FOREGROUND_SERVICE_LOCATION permission'
            require_manifest_entry 'android.permission.ACCESS_BACKGROUND_LOCATION' 'ACCESS_BACKGROUND_LOCATION permission'
            require_manifest_entry 'android.permission.SCHEDULE_EXACT_ALARM' 'SCHEDULE_EXACT_ALARM permission'

            if grep -q 'foregroundServiceType' "$MANIFEST"; then
              if grep -qE 'foregroundServiceType[^>]*(location.*dataSync|dataSync.*location)' "$MANIFEST"; then
                :
              elif ! grep -qE 'foregroundServiceType[^>]*(0x[0-9a-fA-F]+|="[1-9][0-9]*")' "$MANIFEST"; then
                echo "::error title=APK packaging verification failed::Headless worker is missing location+dataSync foreground-service types"
                exit 1
              fi
            else
              echo "::error title=APK packaging verification failed::No foregroundServiceType found in packaged manifest"
              exit 1
            fi

            if grep -q 'StormLogSchedulerService' "$MANIFEST"; then
              echo "::error title=APK packaging verification failed::Obsolete always-running scheduler service is still packaged"
              exit 1
            fi
          fi

          cp "$APK" StormLog-daily-monitor-headless-fgs.apk

      - name: Upload verified hardening APK
        uses: actions/upload-artifact@v4
        with:
          name: StormLog-daily-monitor-headless-fgs-verified
          path: StormLog-daily-monitor-headless-fgs.apk
          if-no-files-found: error
          retention-days: 14

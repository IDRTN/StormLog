name: Daily Monitor Hardening APK

on:
  push:
    branches:
      - daily-monitor-hardening
  workflow_dispatch:

permissions:
  contents: read

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  EXPO_PUBLIC_STORMLOG_LIGHTNING_URL: "https://stormlog-lightning-proxy.idontrememberthename74.workers.dev"
  EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN: ${{ secrets.STORMLOG_LIGHTNING_TOKEN }}

jobs:
  validate-and-build:
    name: Validate hardening and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out hardening branch
        uses: actions/checkout@v4

      - name: Require lightning client token
        shell: bash
        run: |
          if [[ -z "${EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN:-}" ]]; then
            echo "::error title=Missing lightning token::Repository Actions secret STORMLOG_LIGHTNING_TOKEN is required."
            exit 1
          fi

      - name: Verify live lightning proxy authentication
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H 'accept: application/json' \
            -H "x-stormlog-client-token: ${EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN}" \
            "${EXPO_PUBLIC_STORMLOG_LIGHTNING_URL}/events?latitude=40&longitude=-82.5&radiusKm=1&sinceMs=0&untilMs=0")"
          echo "Lightning proxy HTTP status: $STATUS"
          if [[ "$STATUS" != "200" ]]; then
            BODY="$(head -c 500 "$RESPONSE_FILE" | tr '\n' ' ')"
            echo "::error title=Lightning proxy live check failed::Worker returned HTTP $STATUS: $BODY"
            exit 1
          fi
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(p.events))throw new Error("Worker 200 response is missing events array")' "$RESPONSE_FILE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build components
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Compile Daily Monitor hardening runtime tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-hardening-tests
          npx tsc --ignoreConfig \
            src/util/dateUtils.ts \
            src/services/background/dailyMonitorCoordinator.ts \
            src/services/background/__tests__/dailyMonitorHardening.runtime.test.ts \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-hardening-tests

      - name: Run Daily Monitor hardening runtime tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE="$(find /tmp/stormlog-hardening-tests -name dailyMonitorHardening.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Compile Daily Monitor location fallback tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-location-tests
          npx tsc --ignoreConfig \
            src/services/background/dailyMonitorLocationResolver.ts \
            src/services/background/__tests__/dailyMonitorLocationResolver.runtime.test.ts \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-location-tests

      - name: Run Daily Monitor location fallback tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE="$(find /tmp/stormlog-location-tests -name dailyMonitorLocationResolver.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Verify scheduler source architecture
        shell: bash
        run: |
          set -euo pipefail
          SCHED="modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogAlarmScheduler.kt"
          RECEIVER="modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogSchedulerAlarmReceiver.kt"
          WORKER="modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogHeadlessTaskService.kt"
          test -f "$SCHED"
          test ! -f modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler/StormLogSchedulerService.kt
          grep -q 'setExactAndAllowWhileIdle' "$SCHED"
          grep -q 'canScheduleExactAlarms' "$SCHED"
          ! grep -q 'setAndAllowWhileIdle' "$SCHED"
          grep -q 'Exact alarm access required' "$SCHED"
          grep -q 'ContextCompat.startForegroundService' "$RECEIVER"
          grep -q 'startForeground' "$WORKER"
          grep -q 'stopForeground' "$WORKER"
          grep -q 'HeadlessJsTaskService.acquireWakeLockNow' "$RECEIVER"
          grep -q 'ACCESS_BACKGROUND_LOCATION' app.json
          grep -q 'isAndroidBackgroundLocationEnabled' app.json
          grep -q "foregroundServiceType': 'location|dataSync'" plugins/withStormLogScheduler.js
          grep -q 'requestBackgroundPermissionsAsync' src/hooks/useDailyMonitor.ts
          ! grep -R 'StormLogSchedulerService.start' modules/storm-log-scheduler/android/src/main/java/com/stormlog/scheduler

      - name: Generate Android project
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --clean --no-install

      - name: Verify native scheduler autolinking and manifest wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f modules/storm-log-scheduler/android/build.gradle
          npx expo-modules-autolinking resolve --platform android > /tmp/stormlog-autolinking.json
          grep -qi 'storm-log-scheduler' /tmp/stormlog-autolinking.json
          grep -q 'StormLogHeadlessTaskService' android/app/src/main/AndroidManifest.xml
          grep -q 'android:foregroundServiceType="location|dataSync"' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_DATA_SYNC' android/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'ACCESS_BACKGROUND_LOCATION' android/app/src/main/AndroidManifest.xml
          grep -q 'SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml
          grep -q 'StormLogSchedulerAlarmReceiver' android/app/src/main/AndroidManifest.xml
          grep -q 'StormLogExactAlarmPermissionReceiver' android/app/src/main/AndroidManifest.xml
          grep -q 'StormLogSchedulerBootReceiver' android/app/src/main/AndroidManifest.xml
          grep -q 'BOOT_COMPLETED' android/app/src/main/AndroidManifest.xml
          grep -q 'MY_PACKAGE_REPLACED' android/app/src/main/AndroidManifest.xml
          ! grep -q 'StormLogSchedulerService' android/app/src/main/AndroidManifest.xml

      - name: Verify Gradle includes native scheduler project
        shell: bash
        run: |
          set -euo pipefail
          (cd android && ./gradlew projects --no-daemon) | tee /tmp/stormlog-gradle-projects.txt
          grep -qi 'storm-log-scheduler' /tmp/stormlog-gradle-projects.txt

      - name: Enable embedded JS bundle for standalone debug APK
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE="android/app/build.gradle"
          test -f "$GRADLE_FILE"
          test "$(grep -Eic '^[[:space:]]*react[[:space:]]*\{[[:space:]]*$' "$GRADLE_FILE")" -eq 1
          TEMP_GRADLE="$(mktemp)"
          awk '
            BEGIN { inserted = 0 }
            !inserted && $0 ~ /^[[:space:]]*react[[:space:]]*\{[[:space:]]*$/ {
              print
              print "    debuggableVariants = []"
              inserted = 1
              next
            }
            { print }
            END { if (!inserted) exit 1 }
          ' "$GRADLE_FILE" > "$TEMP_GRADLE"
          mv "$TEMP_GRADLE" "$GRADLE_FILE"
          test "$(grep -cF 'debuggableVariants = []' "$GRADLE_FILE")" -eq 1

      - name: Build hardening debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Verify APK and scheduler packaging
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"

          if command -v apkanalyzer >/dev/null 2>&1; then
            MANIFEST=/tmp/stormlog-apk-manifest.xml
            apkanalyzer manifest print "$APK" > "$MANIFEST"

            echo "--- Packaged StormLog scheduler manifest entries ---"
            grep -nE 'StormLog|foregroundServiceType|FOREGROUND_SERVICE_(DATA_SYNC|LOCATION)|ACCESS_BACKGROUND_LOCATION|SCHEDULE_EXACT_ALARM' "$MANIFEST" || true
            echo "--------------------------------------------------"

            require_manifest_entry() {
              local pattern="$1"
              local label="$2"
              if ! grep -qE "$pattern" "$MANIFEST"; then
                echo "::error title=APK packaging verification failed::Missing ${label} in packaged AndroidManifest.xml"
                return 1
              fi
            }

            require_manifest_entry 'StormLogHeadlessTaskService' 'headless foreground worker service'
            require_manifest_entry 'StormLogSchedulerAlarmReceiver' 'alarm receiver'
            require_manifest_entry 'StormLogSchedulerBootReceiver' 'boot/update recovery receiver'
            require_manifest_entry 'StormLogExactAlarmPermissionReceiver' 'exact-alarm permission receiver'
            require_manifest_entry 'android.permission.FOREGROUND_SERVICE_DATA_SYNC' 'FOREGROUND_SERVICE_DATA_SYNC permission'
            require_manifest_entry 'android.permission.FOREGROUND_SERVICE_LOCATION' 'FOREGROUND_SERVICE_LOCATION permission'
            require_manifest_entry 'android.permission.ACCESS_BACKGROUND_LOCATION' 'ACCESS_BACKGROUND_LOCATION permission'
            require_manifest_entry 'android.permission.SCHEDULE_EXACT_ALARM' 'SCHEDULE_EXACT_ALARM permission'

            # apkanalyzer can render foreground-service types symbolically or as
            # a numeric mask. Require both location and dataSync when symbolic;
            # otherwise accept a nonzero mask only after the explicit permissions
            # above have independently verified the intended capabilities.
            SERVICE_LINE="$(grep 'StormLogHeadlessTaskService' "$MANIFEST" || true)"
            if grep -q 'foregroundServiceType' "$MANIFEST"; then
              if grep -qE 'foregroundServiceType[^>]*(location.*dataSync|dataSync.*location)' "$MANIFEST"; then
                :
              elif ! grep -qE 'foregroundServiceType[^>]*(0x[0-9a-fA-F]+|="[1-9][0-9]*")' "$MANIFEST"; then
                echo "::error title=APK packaging verification failed::Headless worker is missing location+dataSync foreground-service types"
                exit 1
              fi
            else
              echo "::error title=APK packaging verification failed::No foregroundServiceType found in packaged manifest"
              exit 1
            fi

            if grep -q 'StormLogSchedulerService' "$MANIFEST"; then
              echo "::error title=APK packaging verification failed::Obsolete always-running scheduler service is still packaged"
              exit 1
            fi
          fi

          cp "$APK" StormLog-daily-monitor-headless-fgs.apk

      - name: Upload verified hardening APK
        uses: actions/upload-artifact@v4
        with:
          name: StormLog-daily-monitor-headless-fgs-verified
          path: StormLog-daily-monitor-headless-fgs.apk
          if-no-files-found: error
          retention-days: 14

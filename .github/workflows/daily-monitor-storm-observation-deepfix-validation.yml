name: Daily Monitor Storm Observation Deep Fix Validation

on:
  push:
    branches:
      - daily-monitor-storm-observation-deepfix-20260909

concurrency:
  group: daily-monitor-storm-observation-deepfix-validation
  cancel-in-progress: true

permissions:
  contents: read

env:
  NPM_CONFIG_LEGACY_PEER_DEPS: "true"
  EXPO_PUBLIC_STORMLOG_LIGHTNING_URL: "https://stormlog-lightning-proxy.idontrememberthename74.workers.dev"
  EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN: ${{ secrets.STORMLOG_LIGHTNING_TOKEN }}

jobs:
  validate:
    name: Validate deep fix without APK assembly
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out deep-fix branch
        uses: actions/checkout@v6

      - name: Require lightning client token
        shell: bash
        run: |
          if [[ -z "${EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN:-}" ]]; then
            echo "::error title=Missing lightning token::Repository Actions secret STORMLOG_LIGHTNING_TOKEN is required."
            exit 1
          fi

      - name: Verify live lightning proxy authentication
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE_FILE="$(mktemp)"
          STATUS="$(curl -sS -o "$RESPONSE_FILE" -w '%{http_code}' \
            -H 'accept: application/json' \
            -H "x-stormlog-client-token: ${EXPO_PUBLIC_STORMLOG_LIGHTNING_TOKEN}" \
            "${EXPO_PUBLIC_STORMLOG_LIGHTNING_URL}/events?latitude=40&longitude=-82.5&radiusKm=1&sinceMs=0&untilMs=0")"
          echo "Lightning proxy HTTP status: $STATUS"
          test "$STATUS" = "200"
          node -e 'const fs=require("fs");const p=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(!Array.isArray(p.events))throw new Error("Worker response missing events array")' "$RESPONSE_FILE"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.16.0"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Install Android build components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006" "cmake;3.22.1"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Compile Daily Monitor hardening runtime tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-hardening-tests
          npx tsc --ignoreConfig \
            src/util/dateUtils.ts \
            src/services/background/dailyMonitorCadence.ts \
            src/services/background/dailyMonitorCoordinator.ts \
            src/services/background/__tests__/dailyMonitorHardening.runtime.test.ts \
            --rootDir src \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-hardening-tests
          CLAIM_STUB="/tmp/stormlog-hardening-tests/services/background/dailyMonitorClaim.js"
          mkdir -p "$(dirname "$CLAIM_STUB")"
          cat > "$CLAIM_STUB" <<'JS'
          exports.claimAutomaticCollection = async () => true;
          exports.markDailyMonitorCollectionSucceeded = async () => undefined;
          exports.releaseAutomaticCollectionLease = async () => undefined;
          JS

      - name: Run Daily Monitor hardening runtime tests
        shell: bash
        run: |
          set -euo pipefail
          TEST_FILE="/tmp/stormlog-hardening-tests/services/background/__tests__/dailyMonitorHardening.runtime.test.js"
          test -s "$TEST_FILE"
          node "$TEST_FILE" 2>&1 | tee /tmp/stormlog-hardening-tests.log
          if grep -q 'Cannot find module' /tmp/stormlog-hardening-tests.log; then
            echo "::error title=Daily Monitor test harness leak::Runtime test crossed an unstubbed native-module boundary"
            exit 1
          fi

      - name: Compile Daily Monitor location fallback tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-location-tests
          npx tsc --ignoreConfig \
            src/services/background/dailyMonitorLocationResolver.ts \
            src/services/background/__tests__/dailyMonitorLocationResolver.runtime.test.ts \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-location-tests
          TEST_FILE="$(find /tmp/stormlog-location-tests -name dailyMonitorLocationResolver.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Compile and run automatic storm policy tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-auto-storm-tests
          npx tsc --ignoreConfig \
            src/services/stormLogs/automaticStormPolicy.ts \
            src/services/stormLogs/__tests__/automaticStormPolicy.runtime.test.ts \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-auto-storm-tests
          TEST_FILE="$(find /tmp/stormlog-auto-storm-tests -name automaticStormPolicy.runtime.test.js -print -quit)"
          test -n "$TEST_FILE"
          node "$TEST_FILE"

      - name: Compile and run warning lifecycle integration tests
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/stormlog-warning-lifecycle-tests
          npx tsc --ignoreConfig \
            src/database/__tests__/warningLifecycle.test.ts \
            --rootDir src \
            --module commonjs --target ES2022 --moduleResolution node --types node \
            --ignoreDeprecations 6.0 --esModuleInterop --skipLibCheck \
            --outDir /tmp/stormlog-warning-lifecycle-tests
          node /tmp/stormlog-warning-lifecycle-tests/database/__tests__/warningLifecycle.test.js

      - name: Verify deep-fix source contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'minimumAutomaticCadenceAgeMs' src/services/background/dailyMonitorCoordinator.ts
          grep -Fq 'minimumAutomaticCadenceAgeMs' src/services/background/dailyMonitorClaim.ts
          grep -Fq 'AFTER INSERT ON daily_weather' src/database/dailyWeatherWriter.ts
          grep -Fq 'AFTER INSERT ON storm_events' src/database/dailyWeatherWriter.ts
          grep -Fq 'WHERE endTime IS NULL AND is_automatic = 1' src/database/dailyWeatherWriter.ts
          grep -Fq 'INSERT INTO weather_observations' src/database/dailyWeatherWriter.ts

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --non-interactive

      - name: Verify generated native scheduler wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/src/main/AndroidManifest.xml
          grep -Fq 'StormLogSchedulerAlarmReceiver' android/app/src/main/AndroidManifest.xml
          grep -Fq 'StormLogHeadlessTaskService' android/app/src/main/AndroidManifest.xml
          grep -Fq 'SCHEDULE_EXACT_ALARM' android/app/src/main/AndroidManifest.xml

      - name: Verify Gradle autolinking and native compilation
        working-directory: android
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Confirm no APK was assembled
        shell: bash
        run: |
          set -euo pipefail
          if find android -type f -name '*.apk' -print -quit | grep -q .; then
            echo "::error title=Validation contract violated::An APK was assembled during no-APK validation"
            exit 1
          fi
          echo 'No APK assembled; deep-fix validation barrier passed.'
